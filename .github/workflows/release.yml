name: release

# Publishes a GitHub Release when a vX.Y.Z tag is pushed:
#   git tag -a v1.0.0 -m "stet v1.0.0" && git push origin v1.0.0
# Assets: stet-{os}-{arch}[.exe], checksums.txt, install.sh, install.ps1.

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Pinned explicitly rather than go-version-file: go.mod declares the minimum
      # language version (1.22), and release binaries should use a supported toolchain.
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.x"

      - name: Test
        run: make test

      - name: Build release binaries
        run: make release VERSION="${GITHUB_REF_NAME}"

      - name: Check embedded version
        run: |
          out=$(./dist/stet-linux-amd64 --version)
          echo "$out"
          case "$out" in
            *"${GITHUB_REF_NAME}"*) ;;
            *) echo "::error::expected ${GITHUB_REF_NAME} in: $out"; exit 1 ;;
          esac

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* install.sh install.ps1 \
            --verify-tag \
            --title "stet $GITHUB_REF_NAME" \
            --generate-notes

  # Installs the just-published release with the tagged installers on each OS.
  verify-install:
    needs: publish
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      STET_RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v7

      # Runs from RUNNER_TEMP so a failed download cannot fall back to building the checkout.
      - name: install.sh
        if: runner.os != 'Windows'
        env:
          STET_INSTALL_DIR: ${{ runner.temp }}/stet-bin
        run: |
          cd "$RUNNER_TEMP"
          bash "$GITHUB_WORKSPACE/install.sh"
          "$STET_INSTALL_DIR/stet" --version | grep -F "$STET_RELEASE_TAG"

      - name: install.ps1
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          STET_INSTALL_DIR: ${{ runner.temp }}\stet-bin
        run: |
          & "$env:GITHUB_WORKSPACE\install.ps1"
          $out = & "$env:STET_INSTALL_DIR\stet.exe" --version
          Write-Host $out
          if ($out -notmatch [regex]::Escape($env:STET_RELEASE_TAG)) { throw "unexpected version: $out" }
