name: release

# Publishes a GitHub Release when a vX.Y.Z tag is pushed. Release notes come from the
# annotated tag message (the stet-release-operator skill writes them):
#   git tag -a v1.0.0 --cleanup=verbatim -F release-notes.md && git push origin v1.0.0
# Assets: stet-{os}-{arch}[.exe], checksums.txt, install.sh, install.ps1.
#
# Recovery for an existing tag (never move or delete a pushed tag):
#   gh workflow run release.yml -f tag=v1.0.0
# Re-runs the gate and build; when the release already exists, assets are re-uploaded in place.

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to (re)publish, e.g. v1.0.0
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Validate tag
        run: |
          if ! printf '%s' "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::tag must be vX.Y.Z (got '$TAG')"
            exit 1
          fi

      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}

      # Pinned explicitly rather than go-version-file: go.mod declares the minimum
      # language version (1.22), and release binaries should use a supported toolchain.
      # Keep in sync with ci.yml.
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.x"
          check-latest: true

      - name: Go version
        run: go version

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: extension/package-lock.json

      # v1.0.0 predates scripts/release-check.sh; re-dispatching it falls back to that tag's gate.
      - name: Release check
        run: |
          if [ -f scripts/release-check.sh ]; then
            scripts/release-check.sh
          else
            make test
          fi

      - name: Build release binaries
        run: make release VERSION="$TAG"

      - name: Check embedded version
        run: |
          out=$(./dist/stet-linux-amd64 --version)
          echo "$out"
          case "$out" in
            *"$TAG"*) ;;
            *) echo "::error::expected $TAG in: $out"; exit 1 ;;
          esac

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG exists; re-uploading assets."
            gh release upload "$TAG" dist/* install.sh install.ps1 --clobber
          else
            gh release create "$TAG" dist/* install.sh install.ps1 \
              --verify-tag \
              --title "stet $TAG" \
              --notes-from-tag
          fi

  # Installs the just-published release with the tagged installers on each OS.
  verify-install:
    needs: publish
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      STET_RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.STET_RELEASE_TAG }}

      # Runs from RUNNER_TEMP so a failed download cannot fall back to building the checkout.
      - name: install.sh
        if: runner.os != 'Windows'
        env:
          STET_INSTALL_DIR: ${{ runner.temp }}/stet-bin
        run: |
          cd "$RUNNER_TEMP"
          bash "$GITHUB_WORKSPACE/install.sh"
          "$STET_INSTALL_DIR/stet" --version | grep -F "$STET_RELEASE_TAG"

      - name: install.ps1
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          STET_INSTALL_DIR: ${{ runner.temp }}\stet-bin
        run: |
          & "$env:GITHUB_WORKSPACE\install.ps1"
          $out = & "$env:STET_INSTALL_DIR\stet.exe" --version
          Write-Host $out
          if ($out -notmatch [regex]::Escape($env:STET_RELEASE_TAG)) { throw "unexpected version: $out" }
